name: la_cambuse
description: "La Cambuse de Git — académie et atelier Git/DevOps"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  flutter_secure_storage: ^11.2.0
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  cambuse_protocol:
    path: packages/cambuse_protocol
  crypto: ^3.0.8

dev_dependencies:
  cambuse_companion:
    path: companion
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  generate: true
  assets:
    - assets/courses/
    - docs/GUIDE_UTILISATEUR.md

  uses-material-design: true

