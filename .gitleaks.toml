# Configuration gitleaks de La Cambuse de Git.
# Règles par défaut, plus une exception explicite et auditable : les dossiers
# de tests contiennent des jetons FACTICES construits exprès pour éprouver la
# détection et le masquage des secrets (ex. ghp_TESTTOKEN000…, AKIAABCDEFGHIJKLMNOP).
# Aucun autre chemin n'est exempté. Audit de l'historique : docs/RAPPORT_FINAL.md.
title = "La Cambuse de Git"

[extend]
useDefault = true

[allowlist]
description = "Jetons factices des tests et exemples pédagogiques des labos"
# Dossiers de tests uniquement.
paths = [
  '''(^|/)test/''',
]
# Valeurs d'exemple des labos de l'Académie (secrets volontairement écrits en
# dur pour apprendre à les retirer) : seules ces valeurs précises sont admises.
regexTarget = "match"
regexes = [
  '''exempleNonValide''',
  '''motdepasse-2024''',
]
