# CI de La Cambuse de Git : analyse, tests (application, compagnon, protocole),
# analyse des secrets, puis builds de livraison (phase 8).
# Actions épinglées par empreinte de commit ; permissions minimales ;
# aucun secret requis. L'APK produit est un APK DE TEST (clé debug).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Analyse des secrets
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyze-test:
    name: Analyse et tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Dépendances
        run: flutter pub get
      - name: Génération de code (Drift) et vérification qu'elle est à jour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/
      - name: Analyse statique
        run: flutter analyze --fatal-infos
      - name: Tests de l'application
        run: flutter test --reporter expanded
      - name: Tests du protocole
        working-directory: packages/cambuse_protocol
        run: dart pub get && dart test
      - name: Tests du compagnon
        working-directory: companion
        run: dart pub get && dart test

  livraison:
    name: Livraison (APK de test, .deb, sources, SBOM)
    needs: [secrets, analyze-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # v2.16.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Dépendances de build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev libsecret-1-dev liblzma-dev dpkg-dev python3-yaml
      - name: Dépendances Dart
        run: |
          flutter pub get
          (cd companion && dart pub get)
      - name: Paquets (tool/package_release.sh)
        run: tool/package_release.sh
      - name: Vérification des sommes
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Rapport dans le résumé
        run: cat dist/BUILD_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: la-cambuse-livraison
          path: |
            dist/*.apk
            dist/*.deb
            dist/*.zip
            dist/sbom.cdx.json
            dist/SHA256SUMS
            dist/BUILD_REPORT.md
          retention-days: 14
