# CI de La Cambuse de Git : analyse, tests (application, compagnon, protocole),
# analyse des secrets, puis builds de livraison (phase 8).
# Actions épinglées par empreinte de commit ; permissions minimales ;
# aucun secret requis. L'APK produit est un APK DE TEST (clé debug).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lancement manuel : gitleaks analyse alors tout l'historique.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Analyse des secrets
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  analyze-test:
    name: Analyse et tests
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Dépendances (application, compagnon, protocole)
        run: |
          flutter pub get
          (cd companion && dart pub get)
          (cd packages/cambuse_protocol && dart pub get)
      - name: Génération de code (Drift) et vérification qu'elle est à jour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/
      - name: Analyse statique
        run: |
          flutter analyze --fatal-infos
          (cd companion && dart analyze --fatal-infos)
          (cd packages/cambuse_protocol && dart analyze --fatal-infos)
      - name: Tests de l'application
        run: flutter test --reporter expanded
      - name: Tests du protocole
        working-directory: packages/cambuse_protocol
        run: dart test
      - name: Tests du compagnon
        working-directory: companion
        run: dart test

  livraison:
    name: Livraison (APK de test, .deb, sources, SBOM)
    needs: [secrets, analyze-test]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Dépendances de build Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev libsecret-1-dev liblzma-dev dpkg-dev python3-yaml
      - name: Dépendances Dart
        run: |
          flutter pub get
          (cd companion && dart pub get)
      - name: Paquets (tool/package_release.sh)
        run: tool/package_release.sh
      - name: Vérification des sommes
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Rapport dans le résumé
        run: cat dist/BUILD_REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: la-cambuse-livraison
          path: |
            dist/*.apk
            dist/*.deb
            dist/*.zip
            dist/sbom.cdx.json
            dist/SHA256SUMS
            dist/BUILD_REPORT.md
          retention-days: 14
